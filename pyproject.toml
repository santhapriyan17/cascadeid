[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascadeid"
version = "0.1.0"
description = "CascadeID — Time-Delayed Behavioral Correlation for Sybil Detection"
requires-python = ">=3.12"
dependencies = [
    # Data & numerics
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=0.20",
    "scipy>=1.12",
    "pyarrow>=15.0",
    # Graph
    "networkx>=3.2",
    "python-louvain>=0.16",
    # Storage
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Blockchain
    "web3>=6.15",
    # ML (optional)
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    # Logging
    "structlog>=24.1",
    # CLI
    "click>=8.1",
    # HTTP client
    "httpx>=0.27",
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "hypothesis>=6.100",
]
notebook = ["jupyterlab>=4.0", "matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
cascadeid = "cascadeid.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
